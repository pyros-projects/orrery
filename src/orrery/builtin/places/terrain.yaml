meta: {source: "orrery landscape creator: the land itself, a noun phrase that holds in every season and weather; `kind` what it is, `climate` (cold, temperate, hot, tropical) the seasons, weather, hours and life it gets, `wet` its water (sea, lake: open fresh water, stream: small water, or no; a boat only where it can float, a heron wherever there is water), `detail` its ground up close, `sfx` how it sounds", builtin: true}
