meta: {source: "orrery setting creator: a place people are in, empty, as a noun phrase with what fills it; `world` (everyday, fantasy, cyberpunk, scifi, noir), `kind` (room, hall, shop, street, vehicle, ruin), `inside` whether it has walls and a ceiling, `outside` the place seen from without (the establishing shot, with its own light), `detail` one thing in it up close, `light` what lights it, `sfx` how it sounds", builtin: true}
