meta: {source: "orrery body-horror pack: what moves inside the host (Codie's subsurface-travel operator)", builtin: true}
entries:
  - a compact humanoid alien, with an elongated head and large dark eyes
  - a gaunt second person, curled tight like a folded umbrella
  - a long-limbed insectile creature, with jointed legs folded against its body
  - a smaller copy of the host, knees drawn to the chest
  - a smooth eyeless figure, with a face like a pressed porcelain mask
  - a hand the size of a torso, with too many long fingers
  - a coiled serpentine being, with a calm human face
