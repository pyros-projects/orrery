meta: {source: "orrery pack: compositions that decide the picture before the style does", builtin: true}
entries:
  - a symmetrical composition with the subject dead centre
  - a tiny subject in a vast empty space
  - an extreme close-up filling the whole frame
  - seen through a rain-streaked window
  - a low worm's-eye view looking up
  - a top-down view from directly above
  - reflected in a shop window at night
  - framed by a doorway in darkness
  - a silhouette against a bright background
  - a wide shot with strong leading lines toward the subject
  - seen through tall grass in the foreground
  - a split composition, half in shadow and half in light
