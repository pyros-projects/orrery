meta: {source: "orrery pack: one surreal twist on any subject; rare by design (weight it low in a brace)", builtin: true}
entries:
  - sealed inside a glass bell jar
  - covered in a fine white hoarfrost
  - made entirely of folded paper
  - half submerged in still black water
  - overgrown with moss and tiny white flowers
  - carved from a single block of marble
  - floating weightless a metre above the ground
  - cast in liquid chrome that ripples as it moves
  - wrapped in gold leaf
  - shown as a transparent glass anatomical model
  - built from thousands of matchsticks
  - dissolving at the edges into a flock of small birds
  - tangled in a web of red thread
  - made of stained glass lit from within
  - woven from living vines
  - stitched together from patchwork quilts
