entries:
  - the lighthouse keeper of a sea that dried up long ago
  - a library where the books are migrating south for the winter
  - the last tree on a planet of glass
  - a cathedral built inside a single whale's ribcage
  - the tailor who sews shadows back onto people
  - a city that folds itself away every night
  - the museum of lost umbrellas
  - a clock tower whose hands are two sleeping cats
  - an orchestra playing on the roof of a sinking train
  - the garden where statues grow from seeds
  - a staircase that leads down into the sky
  - the post office for letters to the dead
  - a lake that reflects a different season than the one around it
  - a whale swimming through a desert of fine sand
  - the moon being repaired by scaffolding workers
  - a forest where every tree is a streetlamp
