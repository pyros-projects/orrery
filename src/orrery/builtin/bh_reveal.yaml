meta: {source: "orrery body-horror pack: how the subsurface effect ends (verb phrases after 'reaches the end of its path and')", builtin: true}
entries:
  - presses its face outward until the stretched skin shows its features in sharp relief, staring into the camera
  - goes still while the skin over it thins and turns faintly translucent, showing its dark eyes
  - splits into two smaller shapes that slide apart in opposite directions
  - slowly withdraws, leaving the skin rippling for a moment before it settles
  - pushes one long hand outward until every finger shows through the skin
