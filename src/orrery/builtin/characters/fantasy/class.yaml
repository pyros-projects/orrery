meta: {source: "orrery fantasy creator: what a character does, with its article; `wear` its clothes (reading the signature $colour), `gear` what it carries (one of several), `familiar` how often a companion goes with it (often, rare)", needs: [colour], builtin: true}
entries:
  - {value: "a wizard", props: {familiar: often, wear: "a $colour hooded robe stitched with silver runes", gear: "{a gnarled oak staff topped with a glowing crystal|a heavy spellbook on a chain at the belt|a crooked wand and a pouch of reagents}"}}
  - {value: "a sorcerer", props: {familiar: rare, wear: "a $colour silk coat with high collars and bare forearms marked with glowing veins", gear: "{a floating orb of $colour light|a staff of black glass|a pair of rune-carved bracers}"}}
  - {value: "a warlock", props: {familiar: often, wear: "a ragged $colour cloak over dark leathers hung with charms", gear: "{a pact blade of black iron|a tome bound in scaled hide|a smouldering eldritch rod}"}}
  - {value: "a necromancer", props: {familiar: often, wear: "funereal $colour robes trimmed with bone beads", gear: "{a staff crowned with a horned skull|a lantern holding a captive soul|a black-handled ritual dagger}"}}
  - {value: "a cleric", props: {familiar: rare, wear: "a $colour tabard over chainmail with a holy sun on the chest", gear: "{a flanged mace and a holy symbol|a censer trailing incense smoke|a tall shield painted with a saint}"}}
  - {value: "a paladin", props: {familiar: rare, wear: "polished plate armour with a $colour surcoat and a flowing cape", gear: "{a greatsword held point-down|a warhammer and a kite shield|a lance with a $colour pennant}"}}
  - {value: "a knight", props: {familiar: rare, wear: "battered plate armour over a $colour heraldic surcoat", gear: "{a longsword and a heater shield|a morning star|a visored helm under one arm}"}}
  - {value: "a warrior", props: {familiar: rare, wear: "a dented breastplate over a $colour quilted gambeson", gear: "{a notched bastard sword|a round shield and a hand axe|a spear taller than they are}"}}
  - {value: "a barbarian", props: {familiar: rare, wear: "furs and leather straps with a $colour sash knotted at the waist", gear: "{a double-bitted greataxe|a massive stone-headed club|two hand axes at the belt}"}}
  - {value: "a ranger", props: {familiar: often, wear: "a weathered $colour cloak over green-brown leathers", gear: "{a longbow and a quiver of fletched arrows|a pair of short swords and a hunting horn|a coiled rope and a skinning knife}"}}
  - {value: "a rogue", props: {familiar: rare, wear: "close-fitting dark leathers with a $colour hood and many pockets", gear: "{a pair of curved daggers|a ring of lock picks and a coin purse|a hand crossbow}"}}
  - {value: "an assassin", props: {familiar: rare, wear: "a black wrap with a $colour veil over the lower face", gear: "{a poisoned stiletto|throwing knives in a bandolier|a garrotte wound around one wrist}"}}
  - {value: "a druid", props: {familiar: often, wear: "a $colour mantle of woven leaves over undyed wool", gear: "{a living staff sprouting green shoots|a golden sickle and a sprig of mistletoe|a pouch of seeds and a bone talisman}"}}
  - {value: "a bard", props: {familiar: rare, wear: "a slashed $colour doublet with puffed sleeves and a feathered cap", gear: "{a lute painted with flowers|a silver flute|a hand drum and a satchel of songbooks}"}}
  - {value: "a monk", props: {familiar: rare, wear: "simple $colour wrapped robes and bound forearms", gear: "{a quarterstaff|a string of prayer beads|bare, taped fists}"}}
  - {value: "an alchemist", props: {familiar: rare, wear: "a leather apron over a $colour shirt stained with reagents, goggles on the brow", gear: "{a bandolier of bubbling vials|a brass alembic|a smoking flask of $colour liquid}"}}
  - {value: "an artificer", props: {familiar: often, wear: "a $colour work coat with brass fittings and a magnifying loupe", gear: "{a clockwork gauntlet|a toolbelt of tiny instruments|a repeating crossbow of their own making}"}}
  - {value: "a witch", props: {familiar: often, wear: "a $colour shawl over layered black skirts and a pointed hat", gear: "{a broom of birch twigs|a cauldron ladle and a bundle of herbs|a poppet stuck with pins}"}}
  - {value: "a shaman", props: {familiar: often, wear: "a cloak of feathers and $colour beads over painted skin", gear: "{a drum stretched with hide|a staff hung with bones and feathers|a smouldering bundle of sage}"}}
  - {value: "a monster hunter", props: {familiar: rare, wear: "a long $colour coat over studded leather, trophies at the belt", gear: "{a silver sword across the back|a crossbow and a string of garlic|a net of chain and a brace of stakes}"}}
  - {value: "a blacksmith", props: {familiar: rare, wear: "a scorched leather apron over a $colour shirt with rolled sleeves", gear: "{a heavy forging hammer|tongs holding a glowing blade|a half-finished helm}"}}
  - {value: "a merchant", props: {familiar: rare, wear: "a fur-trimmed $colour coat with rings on every finger", gear: "{a set of brass scales|a ledger and a fat purse|a box of exotic spices}"}}
  - {value: "a pirate", props: {familiar: often, wear: "a $colour frock coat over a loose shirt, a sash full of pistols", gear: "{a cutlass|a flintlock pistol|a brass spyglass}"}}
  - {value: "a gladiator", props: {familiar: rare, wear: "a single pauldron, a $colour loincloth and leather greaves", gear: "{a trident and a net|a short sword and a round shield|a pair of spiked cestus gloves}"}}
  - {value: "a samurai", props: {familiar: rare, wear: "lacquered $colour armour over a dark kimono", gear: "{a katana and a wakizashi at the hip|a naginata|a longbow of laminated bamboo}"}}
  - {value: "an oracle", props: {familiar: often, wear: "flowing $colour robes and a blindfold embroidered with an eye", gear: "{a bowl of still water|a staff hung with tiny bells|a deck of painted fate cards}"}}
  - {value: "a beastmaster", props: {familiar: often, wear: "hides and a $colour fur-lined mantle with claw necklaces", gear: "{a whip and a whistle carved from bone|a heavy leather falconer's glove|a leash of braided rope}"}}
  - {value: "a healer", props: {familiar: rare, wear: "a clean $colour habit with a white apron full of pockets", gear: "{a satchel of bandages and salves|a staff wound with a carved serpent|a mortar of crushed herbs}"}}
  - {value: "an inquisitor", props: {familiar: rare, wear: "a severe black coat with a $colour stole and a wide-brimmed hat", gear: "{a heavy tome of edicts|a branding iron|a crossbow and a holy seal}"}}
  - {value: "a bounty hunter", props: {familiar: rare, wear: "a dusty $colour duster over chain and leather", gear: "{a set of manacles and a wanted poster|a heavy crossbow|a weighted bolas}"}}
  - {value: "a cartographer", props: {familiar: rare, wear: "a $colour travelling coat with ink-stained cuffs", gear: "{a case of rolled maps|a brass compass and dividers|a surveying staff}"}}
  - {value: "a scholar", props: {familiar: often, wear: "academic $colour robes with spectacles on a cord", gear: "{an armful of scrolls|a quill and a portable desk|a magnifying lens and an ancient tome}"}}
  - {value: "a noble", props: {familiar: rare, wear: "a brocade $colour doublet with a lace collar and a jewelled brooch", gear: "{a rapier with a gilded hilt|a signet ring and a sealed letter|a hunting falcon on a gloved fist}"}}
  - {value: "a jester", props: {familiar: rare, wear: "a motley of $colour and black diamonds with a belled cap", gear: "{a marotte with a grinning face|juggling clubs|a lute with too many strings}"}}
  - {value: "a druid of the deep sea", props: {familiar: often, wear: "a $colour cloak of kelp and shells", gear: "{a trident of driftwood|a conch horn|a net of glowing pearls}"}}
  - {value: "a dragon rider", props: {familiar: rare, wear: "a fitted $colour flight coat with scale-armoured shoulders and goggles", gear: "{a lance with a dragon-scale pennant|a saddle-horn whistle|a long crop and riding gloves}"}}
