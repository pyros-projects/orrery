meta: {source: "orrery noir creator: who a character is in a 1940s city of rain and secrets, with its article; `fit` for whom (women or all, as the outfits), `wear` its clothes (reading the signature $colour as the one accent), `gear` what it holds (one of several)", needs: [colour], builtin: true}
entries:
  - {value: "a private eye", props: {fit: all, wear: "a rumpled trench coat over a loosened $colour tie and a fedora", gear: "{a snub-nosed revolver|a notebook and a stubby pencil|a photograph of a missing girl}"}}
  - {value: "a nightclub singer", props: {fit: women, wear: "a bias-cut $colour satin gown and long gloves", gear: "{a silver microphone|a long cigarette holder|a gardenia in the hair}"}}
  - {value: "a crooked cop", props: {fit: all, wear: "a creased police uniform with a $colour handkerchief stuffed in the pocket", gear: "{an envelope of cash|a nightstick|a badge held up to the light}"}}
  - {value: "a mob accountant", props: {fit: all, wear: "a grey three-piece suit with $colour sleeve garters and round spectacles", gear: "{a ledger with a broken lock|an adding machine tape|a briefcase of banknotes}"}}
  - {value: "a newspaper reporter", props: {fit: all, wear: "a press card tucked in a $colour hatband and rolled shirtsleeves", gear: "{a flash camera|a notepad full of shorthand|a copy of the late edition}"}}
  - {value: "a wealthy heiress", props: {fit: women, wear: "a $colour silk dress under a fox-fur stole and pearls", gear: "{a jewelled compact|a small pearl-handled pistol|a cocktail glass}"}}
  - {value: "a gangster", props: {fit: all, wear: "a sharp pinstriped suit with a $colour silk tie and a pocket square", gear: "{a tommy gun in a violin case|a fat cigar|a pair of brass knuckles}"}}
  - {value: "a bartender", props: {fit: all, wear: "a white jacket with a $colour bow tie", gear: "{a bottle of rye|a rag over one shoulder|a shotgun under the counter}"}}
  - {value: "a cab driver", props: {fit: all, wear: "a flat cap, a leather jacket and a $colour scarf", gear: "{a dented taxi meter key|a racing form|a thermos of coffee}"}}
  - {value: "a washed-up boxer", props: {fit: all, wear: "a $colour robe over taped hands", gear: "{a pair of laced gloves|a cold steak for a black eye|a fight poster}"}}
  - {value: "a cigarette seller", props: {fit: all, wear: "a pillbox hat and a short $colour uniform jacket", gear: "{a tray of cigarettes and matches|a coin changer|a single rose}"}}
  - {value: "a jazz pianist", props: {fit: all, wear: "a white dinner jacket with a $colour carnation", gear: "{sheet music|a glass of whisky on the piano lid|a cigarette in the corner of the mouth}"}}
  - {value: "a forger", props: {fit: all, wear: "a cardigan over a shirt with $colour ink stains on the cuffs", gear: "{a loupe and a fake passport|a fountain pen|a stack of counterfeit bills}"}}
  - {value: "a getaway driver", props: {fit: all, wear: "a leather driving coat and $colour gloves", gear: "{a set of car keys|a map with an escape route|a stopwatch}"}}
  - {value: "a city coroner", props: {fit: all, wear: "a stained lab coat over a $colour bow tie", gear: "{a toe tag|a scalpel|a file of autopsy photographs}"}}
  - {value: "a fixer", props: {fit: all, wear: "a camel overcoat with a $colour scarf and a homburg", gear: "{a little black book|a telephone receiver|an envelope sealed with wax}"}}
  - {value: "a priest", props: {fit: all, wear: "a black cassock with a $colour stole", gear: "{a rosary|a confession booth key|a worn bible}"}}
  - {value: "a bookie", props: {fit: all, wear: "a loud checked jacket with a $colour waistcoat", gear: "{a chalkboard of odds|a fat roll of bills|a racing paper}"}}
