meta: {source: "orrery creature creator: what a creature is, with its article and its own shape; `skin` which coverings fit it (fur, scales, feathers, chitin, hide, slime, stone, bark, shadow), `size` how big it rolls, `home` where it lives (the backdrop follows it)", builtin: true}
