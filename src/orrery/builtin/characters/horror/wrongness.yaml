meta: {source: "orrery characters: one small uncanny detail for __characters/horror__", builtin: true}
entries:
  - a smile that arrives a second too late
  - fingers one joint too long
  - eyes that blink out of time with each other
  - a shadow that stands a little apart from them
  - a voice that sounds slightly behind the moving lips
  - no reflection in dark windows
  - teeth that are all exactly the same size
  - a posture that never shifts its weight
  - skin as smooth and poreless as a mannequin
  - a head tilted a few degrees more than is comfortable
