meta: {source: "orrery cyberpunk creator: the neon city behind a character at night, to follow 'against', softly out of focus so the character stays the subject", builtin: true}
entries:
  - a rain-soaked alley under stacked neon signs, softly out of focus
  - a night market of steaming food stalls and paper lanterns
  - a crowded crosswalk under giant holographic adverts
  - a rooftop above a sea of glowing skyscrapers
  - an elevated train platform in the rain
  - a ramen bar's counter under a flickering sign
  - a back-alley clinic with green fluorescent tubes
  - the wet asphalt of an underpass lit by passing headlights
  - a club entrance washed in purple and pink light
  - a laundromat at three in the morning
  - a stairwell of a megablock covered in graffiti
  - a pawn shop window full of second-hand cybernetics
  - a harbour of container stacks and crane lights
  - a corporate lobby of glass and cold white light
  - an arcade glowing with old cabinets
  - a parking garage lit by one red emergency lamp
  - a street of vending machines humming in the rain
  - a bridge of traffic streaming below
  - a capsule-hotel corridor of numbered hatches
  - a scrapyard of dead robots under a smog moon
  - a fire escape above a flooded street
  - a server farm aisle of blinking lights
  - a noodle-steam-filled side street
  - a highway overpass with a drone swarm overhead
  - a tattoo parlour lit by a red neon dragon
  - a convenience store glowing on an empty corner
  - a monorail car with rain streaking the windows
  - a shrine squeezed between two towers, lanterns lit
  - a fish market under strip lights at dawn
  - a canal of reflected neon and floating rubbish
  - a fight club cage under a single spotlight
  - a smoky karaoke booth with a pink screen
  - a megacorp billboard of a smiling face over a slum
  - a hacker's den of monitors and tangled cable
  - a rain-streaked bus shelter with a glowing ad panel
  - a rooftop garden of solar panels and laundry lines
  - a chop shop with a car half stripped
  - a subway tunnel lit by sodium lights
  - a crowded market under a tarp roof dripping with rain
  - a balcony of a love hotel with a heart-shaped sign
  - a cyberware clinic's waiting room of chrome chairs
  - a street lit by burning barrels between towers
  - a neon-lit pachinko parlour
  - a dock where smuggler boats tie up in the fog
  - a skybridge between two corporate towers
  - a wall of graffiti glowing under blacklight
  - a junction of six streets lit by traffic signals
  - a drive-in screen showing static in the rain
  - a twenty-four-hour diner with a chrome counter
  - an abandoned mall with a dead fountain and neon still lit
