meta: {source: "orrery cyberpunk creator: what a character does in the city, with its article; `wear` its working clothes (reading the signature $colour), `gear` what it carries (one of several), `chrome` how much of the body is replaced (light, heavy)", needs: [colour], builtin: true}
entries:
  - {value: "a netrunner", props: {chrome: light, wear: "a $colour oversized hoodie over a cooling vest, trode cables at the temples", gear: "{a cyberdeck patched with tape|a pair of trode gloves|a bundle of data shards on a lanyard}"}}
  - {value: "a mercenary", props: {chrome: heavy, wear: "a scuffed $colour armoured jacket with ballistic plates and a tactical harness", gear: "{an assault rifle slung low|a heavy pistol in a thigh holster|a smart shotgun}"}}
  - {value: "a street doctor", props: {chrome: light, wear: "a blood-flecked $colour surgical apron over a mesh shirt, loupes on the brow", gear: "{a med-scanner|a roll of surgical tools|a cooler box marked with a red cross}"}}
