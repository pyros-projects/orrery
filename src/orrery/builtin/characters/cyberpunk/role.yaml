  - {value: "a corporate agent", props: {chrome: light, wear: "an immaculate charcoal suit with a $colour pocket square and a corporate pin", gear: "{a briefcase cuffed to the wrist|a sleek smart pistol|a tablet with a non-disclosure agreement}"}}
