meta: {source: "orrery character creator: a habit you notice, exported for screenplays (what the character does in a shot)", builtin: true}
entries:
  - cracks their knuckles before speaking
  - hums under their breath while working
  - sits only where they can see the door
  - bites the inside of their cheek when unsure
  - rubs thumb and forefinger together when thinking
  - squints at strangers before smiling at them
  - moves their lips while counting steps
  - straightens any crooked object within reach
  - tilts their head when listening closely
  - whistles a few notes before answering
  - pats their pockets as if missing something
  - wipes their palms before shaking hands
  - never looks anyone in the eye
  - laughs a beat too late at jokes
  - sniffs food before every bite
  - taps a foot to music nobody hears
  - winks after telling a lie
  - rolls their shoulders before any effort
  - folds their arms tight when challenged
  - checks the sky before stepping outside
  - talks to animals as if to people
  - narrates their own actions aloud
  - stands a little too close when talking
  - keeps glancing over one shoulder
  - answers questions with more questions
  - rocks on their heels while waiting
  - touches the doorframe when entering a room
  - brushes invisible dust off their clothes
  - repeats the last word others say
  - raises one eyebrow instead of answering
  - draws shapes in the air while explaining
  - puts a hand over their heart when sincere
  - claps once to end a discussion
  - keeps nodding long after agreeing
  - snaps their fingers when an idea lands
  - blows into their hands to warm them
  - pinches the bridge of their nose when annoyed
  - drifts off mid-sentence to stare out windows
  - sits on chairs backwards
  - rolls a coin across their knuckles
  - salutes casually instead of waving
  - bows slightly when greeting anyone
  - leans on walls rather than standing free
  - smiles with only one side of their mouth
  - gives every stranger a nickname
  - scratches the back of their neck when embarrassed
  - falls asleep sitting upright anywhere
  - saves the best bite for last
  - checks their reflection in any shiny surface
  - points with the whole hand, never a finger
