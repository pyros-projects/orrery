meta: {source: "orrery expression creator: an expression by name, `face` what the face shows of it and `units` the facial muscles that make it, in the names of FACS action units (Ekman and Friesen's Facial Action Coding System); `set` puts eight together for a sheet: basic (the seven universal emotions and calm), subtle, intense, social, inner, playful", builtin: true}
entries:
  - {value: "calm", props: {set: basic, face: "the brows level, the eyelids relaxed, the lips closed and soft, the gaze straight into the lens", units: "none, every muscle at rest"}}
  - {value: "joy", props: {set: basic, face: "the cheeks lifted, crow's feet at the corners of the eyes, the mouth corners pulled up and out into a wide smile, the upper teeth showing", units: "cheek raiser, lip corner puller, lips part"}}
  - {value: "sadness", props: {set: basic, face: "the inner ends of the brows drawn up and together, the upper eyelids drooping, the mouth corners pulled down, the chin pushed up and wrinkled", units: "inner brow raiser, brow lowerer, lip corner depressor, chin raiser"}}
  - {value: "anger", props: {set: basic, face: "the brows pulled down and together, a hard glare under raised upper lids, the lids tightened, the lips pressed thin", units: "brow lowerer, upper lid raiser, lid tightener, lip tightener, lip pressor"}}
  - {value: "fear", props: {set: basic, face: "the brows raised and drawn together, the upper lids raised to show the whites above the irises, the lips stretched sideways, the jaw dropped", units: "inner brow raiser, outer brow raiser, brow lowerer, upper lid raiser, lid tightener, lip stretcher, jaw drop"}}
  - {value: "disgust", props: {set: basic, face: "the nose wrinkled, the upper lip raised, the cheeks pushed up, the mouth corners pulled down", units: "nose wrinkler, upper lip raiser, lip corner depressor, lower lip depressor"}}
  - {value: "surprise", props: {set: basic, face: "the brows raised high and curved, the forehead lined, the eyes wide open, the jaw dropped open", units: "inner brow raiser, outer brow raiser, upper lid raiser, jaw drop"}}
  - {value: "contempt", props: {set: basic, face: "one corner of the mouth tightened and pulled back, a dimple on that side, the eyes level and cool", units: "lip corner puller and dimpler, on one side only"}}
  - {value: "a polite smile", props: {set: subtle, face: "the mouth corners raised, the lips closed, the eyes smooth and unchanged", units: "lip corner puller"}}
  - {value: "a smirk", props: {set: subtle, face: "one corner of the mouth lifted, the lips closed, one brow slightly raised, a knowing look", units: "lip corner puller on one side, outer brow raiser on one side"}}
  - {value: "wistfulness", props: {set: subtle, face: "a faint, sad half-smile, the inner brows slightly raised, the eyes soft and looking past the lens", units: "inner brow raiser, a slight lip corner puller, eyes turned aside"}}
  - {value: "boredom", props: {set: subtle, face: "heavy, half-closed eyelids, the brows flat, the mouth slack, the head tilted to one side", units: "lid droop, lips part, head tilt"}}
  - {value: "scepticism", props: {set: subtle, face: "one brow raised high, the other lowered, the eyes narrowed, the lips pressed to one side", units: "outer brow raiser on one side, brow lowerer, lid tightener, lip pressor"}}
  - {value: "pensiveness", props: {set: subtle, face: "the brows slightly drawn together, the gaze lowered and inward, the lips pressed lightly together", units: "brow lowerer, eyes down, lip pressor"}}
  - {value: "tiredness", props: {set: subtle, face: "drooping eyelids, dark circles under the eyes, the brows lifted to keep the eyes open, the mouth slack", units: "lid droop, inner brow raiser, lips part"}}
  - {value: "amusement", props: {set: subtle, face: "a laugh held back: the lips pressed together and twitching up at the corners, the cheeks raised, the eyes crinkled", units: "cheek raiser, lip corner puller, lip pressor"}}
  - {value: "a belly laugh", props: {set: intense, face: "the head thrown back a little, the eyes squeezed into crescents, the mouth wide open showing the teeth, deep laugh lines", units: "cheek raiser, lid tightener, lip corner puller, jaw drop, head up"}}
  - {value: "sobbing", props: {set: intense, face: "the face crumpled, the inner brows pulled up and together, the eyes squeezed and wet with tears, the mouth open and pulled down at the corners", units: "inner brow raiser, brow lowerer, lid tightener, lip corner depressor, lip stretcher, jaw drop"}}
  - {value: "rage", props: {set: intense, face: "a roar: the brows slammed down and together, the eyes glaring, the nose wrinkled, the mouth wide open in a square with the teeth bared", units: "brow lowerer, upper lid raiser, lid tightener, nose wrinkler, upper lip raiser, mouth stretch"}}
  - {value: "terror", props: {set: intense, face: "a scream: the brows high and pulled together, the eyes wide with white all around the irises, the mouth stretched wide open, the tendons of the neck standing out", units: "inner brow raiser, outer brow raiser, brow lowerer, upper lid raiser, lip stretcher, mouth stretch, neck tightener"}}
  - {value: "shock", props: {set: intense, face: "the eyes wide and staring, the brows high, the mouth hanging open, the face drained of colour", units: "inner brow raiser, outer brow raiser, upper lid raiser, jaw drop"}}
  - {value: "agony", props: {set: intense, face: "the eyes squeezed shut, the brows knotted, the nose wrinkled, the teeth clenched and bared", units: "brow lowerer, cheek raiser, lid tightener, nose wrinkler, upper lip raiser, lip stretcher, eyes closed"}}
  - {value: "triumph", props: {set: intense, face: "a victory yell: the eyes wide and fierce, the brows up, the mouth open in a shout, the chin lifted", units: "outer brow raiser, upper lid raiser, lip corner puller, mouth stretch, head up"}}
  - {value: "revulsion", props: {set: intense, face: "the nose wrinkled hard, the upper lip curled, the tongue pushing forward, the eyes narrowed, the head pulled back", units: "nose wrinkler, upper lip raiser, lid tightener, tongue show, head back"}}
  - {value: "flirtation", props: {set: social, face: "one eye closed in a wink, the other bright, a half-smile with one mouth corner raised, the chin dipped", units: "wink, lip corner puller on one side, head down"}}
  - {value: "embarrassment", props: {set: social, face: "flushed cheeks, the gaze dropped and turned away, a tight, awkward smile with the lips pressed", units: "lip corner puller, lip pressor, eyes down, head turned aside"}}
  - {value: "smugness", props: {set: social, face: "a self-satisfied closed-mouth smile, the eyelids lowered, the chin raised, one brow slightly up", units: "lip corner puller, lid droop, chin raiser, head up"}}
  - {value: "suspicion", props: {set: social, face: "the eyes narrowed to slits, the brows lowered, a sideways look at the lens, the lips pressed tight", units: "brow lowerer, lid tightener, slit, eyes turned aside, lip pressor"}}
  - {value: "pleading", props: {set: social, face: "the inner brows pulled up high, the eyes wide and glistening, the lips parted and trembling", units: "inner brow raiser, upper lid raiser, lips part"}}
  - {value: "defiance", props: {set: social, face: "the chin raised, the jaw set, the brows lowered, a steady glare straight into the lens, the lips pressed", units: "brow lowerer, lid tightener, chin raiser, lip pressor, head up"}}
  - {value: "sympathy", props: {set: social, face: "the inner brows slightly raised, a gentle closed-mouth smile, warm eyes, the head tilted to one side", units: "inner brow raiser, lip corner puller, head tilt"}}
  - {value: "sheepishness", props: {set: social, face: "an apologetic grin showing the teeth, the brows raised in the middle, the shoulders hunched up, the gaze glancing up", units: "inner brow raiser, lip corner puller, lip stretcher, eyes up"}}
  - {value: "determination", props: {set: inner, face: "the brows lowered and level, the eyes focused and steady, the jaw clenched, the lips pressed into a firm line", units: "brow lowerer, lid tightener, lip pressor, jaw clencher"}}
  - {value: "awe", props: {set: inner, face: "the brows raised, the eyes wide and shining, the lips parted, the gaze lifted above the lens", units: "inner brow raiser, outer brow raiser, upper lid raiser, lips part, eyes up"}}
  - {value: "longing", props: {set: inner, face: "the inner brows raised, the eyes soft and glistening, the lips slightly parted, the gaze drifting off to one side", units: "inner brow raiser, lips part, eyes turned aside"}}
  - {value: "guilt", props: {set: inner, face: "the head bowed, the gaze dropped, the inner brows raised, the lips pulled in and pressed", units: "inner brow raiser, lip suck, eyes down, head down"}}
  - {value: "pride", props: {set: inner, face: "a small, satisfied smile, the chin lifted, the eyes calm and bright, the shoulders back", units: "lip corner puller, chin raiser, head up"}}
  - {value: "confusion", props: {set: inner, face: "the brows knitted, one higher than the other, the eyes squinting, the head tilted, the mouth slightly open", units: "brow lowerer, outer brow raiser on one side, squint, lips part, head tilt"}}
  - {value: "nervousness", props: {set: inner, face: "a tight, forced smile, the eyes darting sideways, the brows slightly raised, the lower lip caught between the teeth", units: "inner brow raiser, lip stretcher, lip bite, eyes turned aside"}}
  - {value: "relief", props: {set: inner, face: "the eyes closed, the brows relaxed upward, a long breath out through slightly parted lips, a faint smile", units: "inner brow raiser, eyes closed, lips part, lip corner puller"}}
  - {value: "a pout", props: {set: playful, face: "the lips pushed out in a pout, the brows drawn together, the chin raised, the eyes looking up", units: "lip puckerer, brow lowerer, chin raiser, eyes up"}}
  - {value: "puffed cheeks", props: {set: playful, face: "the cheeks puffed full of air, the lips sealed tight, the eyes wide", units: "cheek puff, lip pressor, upper lid raiser"}}
  - {value: "a stuck-out tongue", props: {set: playful, face: "the tongue stuck far out, one eye squeezed shut, the nose scrunched", units: "tongue show, wink, nose wrinkler"}}
  - {value: "a cheeky grin", props: {set: playful, face: "a grin from ear to ear showing all the teeth, the eyes squeezed into happy crescents", units: "cheek raiser, lip corner puller, lip stretcher, lips part"}}
  - {value: "a side-eye", props: {set: playful, face: "the head facing the lens, the eyes turned hard to one side, one brow raised, the lips pursed", units: "eyes turned aside, outer brow raiser on one side, lip puckerer"}}
  - {value: "a gasp", props: {set: playful, face: "the eyes wide, the brows high, the mouth a small round O, the nostrils flared", units: "inner brow raiser, outer brow raiser, upper lid raiser, lip funneler, nostril dilator"}}
  - {value: "mischief", props: {set: playful, face: "a sly, lopsided grin, the brows lowered, the eyes narrowed and glinting, the chin tucked down", units: "brow lowerer, lid tightener, lip corner puller on one side, head down"}}
  - {value: "an eye-roll", props: {set: playful, face: "the eyes rolled up toward the ceiling, the eyelids half lowered, the mouth flattened in exasperation", units: "eyes up, lid droop, lip pressor"}}
