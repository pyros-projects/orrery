meta: {source: "orrery sci-fi creator: a character's work aboard and beyond, with its article; `wear` its clothes (reading the signature $colour), `gear` what it carries (one of several)", needs: [colour], builtin: true}
entries:
  - {value: "a starship captain", props: {wear: "a fitted $colour command coat with a high collar and rank pips", gear: "{a captain's datapad|a holstered sidearm|a cup of coffee and a star chart}"}}
  - {value: "a fighter pilot", props: {wear: "a $colour flight suit with a G-harness and mission patches", gear: "{a helmet under one arm|a flight log chip|a pair of mirrored visor goggles}"}}
