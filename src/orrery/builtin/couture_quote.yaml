meta: {source: "orrery fashion pack: things designers say in interviews", builtin: true}
entries:
  - This season, we asked what a sleeve owes the arm.
  - The collection is about the absence of the collection.
  - I wanted the fabric to feel slightly embarrassed.
  - Beige is not a colour. It is a decision.
  - We removed everything until only the doubt remained.
  - The hem is where the garment admits it is afraid.
  - It is not a coat. It is a coat remembering a coat.
  - Comfort is a bourgeois invention.
  - Every button is a small betrayal.
  - We are post-shoulder now.
