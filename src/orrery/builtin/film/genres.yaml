meta: {source: "orrery film: a genre, for a reel that plays any character in any place as one (Surprise me, #149); `manner` how it plays, `peak` its big moment, `music` and `sfx` its sound", builtin: true}
entries:
  - {value: "a daytime soap opera", props: {manner: "overwrought confessions, slow push-ins on shocked faces and every line delivered as if it were the last", peak: "a shocking secret revealed, a slow zoom onto a gasping face and a freeze frame", music: "A swelling organ sting over soft strings.", sfx: "a sharp gasp and a slammed door"}}
  - {value: "a spaghetti western", props: {manner: "squinting stares in extreme close-up, a long silence before anyone moves and dust blowing across the ground", peak: "a showdown at high noon, a hand hovering over a holster as the wind drops", music: "A lonely whistled melody over a twanging guitar and a distant choir.", sfx: "spurs jingling and the wind"}}
  - {value: "a heist thriller", props: {manner: "a plan laid out in quick cuts, everything going right until one thing goes wrong", peak: "the vault swinging open on something nobody expected", music: "A cool, ticking bass line with brushed drums.", sfx: "a lock clicking open and a clock ticking"}}
  - {value: "a romantic comedy", props: {manner: "a clumsy meet-cute, an embarrassed laugh and a look held a moment too long", peak: "a dash through the place to say it before it is too late", music: "A light, bouncy acoustic guitar with whistling.", sfx: "a nervous laugh and a dropped cup"}}
  - {value: "a horror film", props: {manner: "a slow creep toward something half seen, a false scare, then the real one", peak: "the lights going out and something breathing very close", music: "A low drone with sudden screeching strings.", sfx: "a creak in the dark and a held breath"}}
  - {value: "a nature documentary", props: {manner: "patient observation from a distance, as if the hero were a rare animal in its habitat", peak: "the hero doing something never before caught on camera", music: "A sweeping orchestral theme, gentle and full of wonder.", sfx: "rustling and distant birdsong"}}
  - {value: "a sitcom", props: {manner: "broad reactions, a running gag and a perfectly timed pause", peak: "everything going wrong at once, and a long, slow look straight into the camera", music: "A short, jaunty bass-and-horns sting.", sfx: "a laugh track and a door bell"}}
  - {value: "a kung fu film", props: {manner: "a calm stance, a sudden flurry of moves and a pose held at the end", peak: "a single perfect strike in slow motion, leaves swirling around it", music: "Pounding drums and a high, tense flute.", sfx: "whooshing strikes and fabric snapping"}}
  - {value: "a film noir", props: {manner: "hard shadows, a cigarette's smoke, a weary voice-over and a secret everyone wants buried", peak: "the truth coming out in a single line under a swinging lamp", music: "A smoky solo saxophone over a slow walking bass.", sfx: "rain and a distant siren"}}
  - {value: "a musical", props: {manner: "the hero bursting into song and a dance that takes over the whole place", peak: "a showstopping finale, arms flung wide on the last note", music: "A big, brassy show tune building to a finale.", sfx: "tap shoes and snapping fingers"}}
  - {value: "a cooking show", props: {manner: "everything presented with pride, measured and stirred with flourishes and tasted with closed eyes", peak: "the grand reveal of a finished dish under a silver cloche", music: "A cheerful pizzicato tune.", sfx: "sizzling and chopping"}}
  - {value: "a courtroom drama", props: {manner: "a tense standoff, a surprise piece of evidence and a long silence", peak: "a single object held up as proof, and the room falling silent", music: "Low, rising strings.", sfx: "a gavel banging and a murmur"}}
  - {value: "a spy thriller", props: {manner: "a secret handover, a glance over the shoulder and a narrow escape", peak: "a gadget that saves the day at the last second", music: "A pulsing electronic beat with stabbing brass.", sfx: "a gadget beeping and fast footsteps"}}
  - {value: "a disaster film", props: {manner: "a small warning sign ignored, then everything shaking and falling apart", peak: "a desperate leap as the ground gives way", music: "Thundering percussion and a full choir.", sfx: "rumbling, cracking and roaring"}}
  - {value: "a telenovela", props: {manner: "a dramatic slap, a tearful vow and a secret twin hinted at", peak: "a long-lost letter read aloud, and a scream of disbelief", music: "A passionate guitar and swelling violins.", sfx: "a slap and a sob"}}
  - {value: "a superhero film", props: {manner: "a moment of choice, a heroic landing and a line delivered against the wind", peak: "the hero rising into the air as the music peaks", music: "A soaring, triumphant brass theme.", sfx: "a whoosh and a heavy landing"}}
  - {value: "a mockumentary", props: {manner: "awkward glances at the camera, a confession to the lens and a plan that falls flat", peak: "a proud moment that collapses, and a slow turn to the camera", music: "A quiet, plinky ukulele.", sfx: "an awkward silence and a cough"}}
  - {value: "a fairy tale", props: {manner: "a wish, a warning and something magical happening at the stroke of a bell", peak: "a transformation in a shower of sparkling light", music: "A twinkling celesta and soft strings.", sfx: "chimes and a soft wind"}}
  - {value: "a buddy cop film", props: {manner: "arguing with the nearest thing as if it were a partner, a chase and a reluctant high five", peak: "a screeching chase ending in a perfectly timed catch", music: "A funky guitar riff with slap bass.", sfx: "a siren and screeching tyres"}}
  - {value: "a war film", props: {manner: "taking cover, a shouted order and a brave run through smoke", peak: "a flag raised through the smoke as the noise falls away", music: "Slow, solemn snare and horns.", sfx: "distant explosions and a shouted order"}}
  - {value: "a teen drama", props: {manner: "a crush, a rumour and a walk through the place as everyone stares", peak: "a note passed, opened and read with wide eyes", music: "A dreamy indie pop song.", sfx: "a locker slamming and whispers"}}
  - {value: "a silent slapstick comedy", props: {manner: "pratfalls, a chase in fast motion and a hat that keeps falling off", peak: "a perfect domino of disasters ending in a pie", music: "A frantic ragtime piano.", sfx: "a slide whistle and a crash"}}
  - {value: "a space opera", props: {manner: "a grand destiny, a ship to catch and a sky full of stars", peak: "a twin-sun sunset and a vow to the stars", music: "A sweeping, heroic orchestral fanfare.", sfx: "engines roaring and a laser blast"}}
  - {value: "a monster movie", props: {manner: "something huge in the distance, a pointed finger and the ground shaking", peak: "a giant eye opening right behind the hero", music: "Booming low brass and timpani.", sfx: "a distant roar and crashing"}}
  - {value: "a period costume drama", props: {manner: "a letter read by candlelight, a meaningful glance and impeccable manners hiding a scandal", peak: "a glove dropped on purpose, and a gasp", music: "A delicate harpsichord and strings.", sfx: "a quill scratching and a clock chiming"}}
  - {value: "a road movie", props: {manner: "an open road, a breakdown in the middle of nowhere and a stranger's help", peak: "a sunrise at the end of the road and a long breath out", music: "A rolling country guitar.", sfx: "an engine and the wind"}}
  - {value: "a psychological thriller", props: {manner: "a creeping doubt, a reflection that looks wrong and a sudden realisation", peak: "the hero's reflection moving a moment too late", music: "A dissonant, pulsing synth.", sfx: "a heartbeat and a ticking clock"}}
  - {value: "a sports underdog film", props: {manner: "a training montage, a fall, and a comeback at the last second", peak: "a slow-motion triumph as the crowd erupts", music: "A rousing rock anthem.", sfx: "a roaring crowd and a whistle"}}
  - {value: "a true-crime documentary", props: {manner: "evidence laid out on a table, a slow pan across photographs and a narrator's grave voice", peak: "one detail in a photograph circled in red", music: "A low, ominous piano.", sfx: "a camera shutter and a tape recorder clicking"}}
  - {value: "a children's puppet show", props: {manner: "everything bright and simple, a lesson learned and a song about it", peak: "a big happy bow, and confetti", music: "A bouncy xylophone and kazoo tune.", sfx: "a boing and a giggle"}}
