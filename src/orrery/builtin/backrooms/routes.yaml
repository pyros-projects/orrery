meta: {source: "orrery pack: which way a found-footage camera operator runs, a phrase after 'runs'", builtin: true}
entries:
  - through room after identical room, doorframes splintering behind
  - down a corridor that keeps getting longer
  - up a stairwell three steps at a time
  - between rows of shelving that sway as it crashes into them
  - across an open hall with nowhere to hide
  - through a kitchen, knocking pans to the floor
  - down a slope of wet carpet, slipping
  - along a row of doors, trying every handle
  - through a car park, ducking between pillars
  - over a counter and through a swinging door
  - into a lift and hammering the close button
  - through a maze of cubicle walls that fall like dominoes behind
  - down a corridor of flickering lights, the dark closing in behind
  - through a ball pit, plastic balls flying
  - along a hospital corridor, shoving a gurney back toward it
  - through a field of folding chairs that scatter and clatter
  - up an escalator that runs the wrong way
  - through a shallow flooded hall, water spraying
  - between washing machines that rattle in their frames
  - across a gym, sliding on the polished floor
