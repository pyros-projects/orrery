meta: {source: "orrery pack: things that live in an endless found-footage walk, orrery's own; what a camera sees (value), how the operator gets away (escape: look-away, silence, chase, water, friendly, hide, light, follow), what it does then (meet, a clause after its description) and its sound (sfx)", builtin: true}
entries:
  - {value: "a thin grey figure with no face, only a smooth dent where a face should be, in a damp office shirt", props: {escape: "look-away", meet: "stops a hand's breadth from the lens and tilts its blank head, then walks on", sfx: "wet cloth dragging and a slow, even breathing that is not the operator's"}}
  - {value: "a pale, grinning face in the dark of a doorway, its mouth far too wide and full of white teeth", props: {escape: "look-away", meet: "drifts closer, the grin widening, until it is gone like a light switched off", sfx: "a soft, delighted giggle"}}
  - {value: "a very tall woman in a hospital gown, her head almost at the ceiling and her hair over her face", props: {escape: "look-away", meet: "bends down until its hair brushes the operator's shoulder, then straightens and walks away", sfx: "bare heels on tiles and a long, wet sigh"}}
  - {value: "a man in a grey 1990s suit with his back to the room", props: {escape: "look-away", meet: "turns its head a little more each time the picture flickers, then is simply not there", sfx: "a cheap watch ticking loudly"}}
  - {value: "a shape made of static, a person-shaped hole where the picture breaks into snow", props: {escape: "look-away", meet: "passes through the frame, the whole picture tearing as it goes", sfx: "a roar of tape hiss rising and falling"}}
  - {value: "a pack of lean, hairless dogs with human hands for front paws", props: {escape: "silence", meet: "pad through the room in a line, their heads turning at every creak, and pass the hiding place by", sfx: "soft pads on carpet and clicking nails"}}
  - {value: "a blind thing like a giant pale cricket as tall as a man, with long, sweeping antennae", props: {escape: "silence", meet: "sweeps its antennae over the hiding place, a hair's breadth from the lens, and moves on", sfx: "a dry chirping and antennae whispering against the walls"}}
  - {value: "a woman in a wedding dress with a veil down to the floor", props: {escape: "silence", meet: "stops right beside the hiding place, listening, and glides away when nothing stirs", sfx: "a dress train hissing over the floor and someone humming a wedding march"}}
  - {value: "a cluster of telephone receivers dangling on their own cords", props: {escape: "silence", meet: "sways closer, each receiver turning toward the hiding place, then drifts back up into the ceiling", sfx: "dial tones and a whispering on the line"}}
  - {value: "a huge, slow creature like a hairless bear on its hind legs, with tiny eyes and enormous ears", props: {escape: "silence", meet: "turns its great ears toward every sound in the room, stands still a long moment, and lumbers away", sfx: "heavy footfalls and a deep, wet snuffling"}}
  - {value: "a child-sized figure in a yellow raincoat with the hood up", props: {escape: "silence", meet: "walks right up to the hiding place, waits, and skips away", sfx: "rubber boots squeaking and a small voice counting to ten"}}
  - {value: "a giant, many-jointed thing like a folding chair come to life, all metal legs and a cracked plastic seat for a head", props: {escape: "chase", meet: "clatters after them, folding and unfolding, scraping along the walls", sfx: "metal legs clattering and scraping"}}
  - {value: "a man in a mascot costume of a smiling yellow bird, its painted grin stained", props: {escape: "chase", meet: "lopes after them on its big padded feet, much faster than it should be", sfx: "padded feet thumping and a muffled laugh inside the costume"}}
  - {value: "a crowd of mannequins", props: {escape: "chase", meet: "move only in the dark between flickers of the lights, closer every time, reaching", sfx: "plastic limbs knocking together in the dark"}}
  - {value: "a long, low creature like a hairless greyhound the length of a car, all ribs", props: {escape: "chase", meet: "bounds after them, its claws skidding on every corner", sfx: "claws skittering and a thin, whining howl"}}
  - {value: "a swarm of moths as thick as smoke", props: {escape: "chase", meet: "pours after them through every doorway, wings beating against the lens", sfx: "a roar of thousands of wings"}}
  - {value: "a hulking janitor with no eyes and a mop dripping something dark", props: {escape: "chase", meet: "drops the mop and lumbers after them, the bucket clanging behind", sfx: "a mop bucket's wheels rattling and heavy boots"}}
  - {value: "a tall shadow with arms long enough to trail on the floor", props: {escape: "chase", meet: "surges after them, swallowing each room's light as it comes", sfx: "the lights popping one by one behind them"}}
  - {value: "a pale, eyeless eel as long as a corridor, with faintly glowing skin", props: {escape: "water", meet: "slides past under the surface, its glow lighting the water green", sfx: "water churning and a deep bubbling"}}
  - {value: "a drowned swimmer in an old striped bathing suit", props: {escape: "water", meet: "floats face down, turns over in the water to face the camera, then sinks without a ripple", sfx: "water lapping and a muffled whistle from under the surface"}}
  - {value: "a huge hand of white, waterlogged fingers", props: {escape: "water", meet: "reaches up out of the water, feels along the edge for the operator, and sinks back", sfx: "water dripping off great fingers"}}
  - {value: "a round, fluffy creature the size of a sofa with big soft eyes and a little wiggling nose", props: {escape: "friendly", meet: "rolls up to the camera, nuzzles the operator's knees, and rolls away squeaking happily", sfx: "a happy, high squeaking"}}
  - {value: "an old janitor with kind eyes and a ring of a hundred keys on his belt", props: {escape: "friendly", meet: "smiles, presses a key into the operator's hand, nods at a door, and shuffles off", sfx: "keys jingling and a hummed tune"}}
  - {value: "a long purple balloon dog with no one holding its string", props: {escape: "friendly", meet: "bobs up to the lens, bumps it gently, and floats off down the hall wagging", sfx: "a balloon squeaking and a soft rubbery bounce"}}
  - {value: "a deer made of soft yellow light", props: {escape: "friendly", meet: "lowers its glowing head to the camera, breathes warm light over the lens, and walks off through a wall", sfx: "a warm, low hum like a tuning fork"}}
  - {value: "a lost, mild office worker with a coffee mug and years of dust on his shoulders", props: {escape: "friendly", meet: "raises the mug in a tired greeting, points the operator the way he came from, and wanders off", sfx: "a spoon clinking in a mug and a polite cough"}}
  - {value: "a spider the size of a dog with a porcelain doll's face", props: {escape: "hide", meet: "skitters over the furniture, peers into every gap, and skitters past the hiding place", sfx: "many legs ticking over hard surfaces"}}
  - {value: "a hunched thing with a television set for a head, the operator on its screen", props: {escape: "hide", meet: "turns slowly through the room, its screen searching, and the operator's image on it fades as it walks away", sfx: "a television's high whine and channel-change clicks"}}
  - {value: "a tall man in a hotel bellhop's uniform with a smile far too wide", props: {escape: "hide", meet: "opens every door in the room, checks behind every curtain, and wanders off still smiling", sfx: "a little bell ringing and doors opening one by one"}}
  - {value: "a creature like a giant skinned rabbit on its hind legs", props: {escape: "hide", meet: "sniffs along the floor toward the hiding place, stops, sneezes, and hops away", sfx: "loud, wet sniffing"}}
  - {value: "a nurse with a featureless white mask for a face and an empty wheelchair", props: {escape: "hide", meet: "wheels the chair slowly through the room, stopping at every bed, and pushes on", sfx: "a wheelchair's squeaking wheel and soft shoes"}}
  - {value: "a flock of crows made of folded black paper", props: {escape: "hide", meet: "rustles from perch to perch, pecking at every hiding place but this one, and lifts off as one", sfx: "dry paper wings and a papery cawing"}}
  - {value: "a pale, hairless thing with long, gripping toes", props: {escape: "light", meet: "shrieks and shrinks back from the beam, folding itself up into the ceiling tiles", sfx: "a shriek like a dentist's drill"}}
  - {value: "a mass of black hair like a living rug", props: {escape: "light", meet: "curls back from the beam, smoking where the light touches, and slides away under a door", sfx: "a dry hiss and hair rustling"}}
  - {value: "a man-shaped shadow with no one to cast it", props: {escape: "light", meet: "flinches from the beam and slides off the floor and up the walls into a dark corner", sfx: "a sound like a held breath let out"}}
  - {value: "a cluster of glossy black eyes in the dark", props: {escape: "light", meet: "blinks out of time, squeezes shut eye by eye in the beam, and backs into the dark", sfx: "a wet clicking of many eyelids"}}
  - {value: "a long-armed creature with a lamp-shade for a head, the bulb inside dead", props: {escape: "light", meet: "turns away from the beam, its own dead bulb flickering once, and shuffles off", sfx: "a bulb fizzing and a cord dragging"}}
  - {value: "a small girl in a party hat with a red balloon", props: {escape: "follow", meet: "smiles, turns, and walks slowly away, the balloon bobbing, looking back to make sure the camera follows", sfx: "a party blower squeaking and soft footsteps"}}
  - {value: "a tall figure in a dark usher's uniform with a torch, its face in shadow", props: {escape: "follow", meet: "clicks on its torch, bows, and walks ahead, lighting the way", sfx: "a torch clicking and polished shoes on carpet"}}
  - {value: "a glowing cat with too many tails", props: {escape: "follow", meet: "meows once, flicks its tails, and trots off, stopping at every corner to look back", sfx: "a soft meow and padding paws"}}
