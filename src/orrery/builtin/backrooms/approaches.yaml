meta: {source: "orrery pack: how something on an endless found-footage walk shows itself to the camera, a clause after its description", builtin: true}
entries:
  - stands at the far end of the room, perfectly still, facing the camera
  - steps out from behind a pillar a few metres ahead
  - crawls out of a dark doorway on all fours
  - is already in the room when the lights flicker back on
  - rises slowly from behind a row of empty desks
  - unfolds from a corner where there was only shadow a moment ago
  - drops from the ceiling tiles and lands without a sound
  - is standing right behind the operator when the camera turns around
  - walks out of a wall as if the wall were mist
  - leans into the frame from the edge of a doorway, upside down
  - waits at the end of the corridor, getting closer every time the lights flicker
  - comes up the stairs one slow step at a time
  - sits in a chair in the middle of the room, turned toward the camera
  - is reflected in a window long before it is in the room
  - rolls out from under a parked trolley
  - peels itself off the wallpaper
  - stands up out of a pile of something on the floor
  - appears in the gap of a half-open door, one eye at the crack
  - is the shape the camera took for a coat on a hook, until it moves
  - wades out of the dark at the end of the room
  - climbs out of a lift whose doors open on their own
  - is waiting at the next doorway, exactly where the camera was about to go
  - floats down a stairwell, turning slowly
  - fills a doorway that is too small for it
  - walks in step beside the camera for a moment before the operator sees it
