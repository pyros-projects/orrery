meta: {source: "orrery pack: five non-human entities from the SCP Wiki, rewritten as what a camera sees and one visible action each (id, cite, cell, act, shot, sfx)", license: "CC BY-SA 3.0 (https://creativecommons.org/licenses/by-sa/3.0/). Unlike the rest of orrery, this file is adapted from SCP Wiki articles and shares their license. Each entry's cite names its article, authors and source. Anything made from it is an adaptation too: credit the cite and share it under CC BY-SA 3.0.", builtin: true}
entries:
  - value: "a very tall, emaciated humanoid creature, about two and a half metres tall, with chalk-white hairless skin stretched over its bones, pale pigmentless eyes and arms far too long for its body that hang down past its knees"
    props: {id: "SCP-096", cite: "\"SCP-096\" by Dr Dan, from the SCP Wiki. Source: https://scpwiki.com/scp-096. Licensed under CC BY-SA 3.0.", cell: "a bare steel cube five metres wide, lit by a single caged lamp", act: "paces slowly along the far wall with its back to the camera, stops, turns its head halfway toward the lens, then snaps its long hands up over its face as its whole body begins to shake", shot: "push in, small, slow", sfx: "bare feet slapping on steel, then a thin, rising human wail that breaks into sobbing"}
  - value: "a huge, vaguely reptilian creature of no known species, its hide half dissolved and raw, gills flaring inside its nostrils"
    props: {id: "SCP-682", cite: "\"SCP-682\" by Dr Gears and Epic Phail Spy, from the SCP Wiki. Source: https://scpwiki.com/scp-682. Licensed under CC BY-SA 3.0.", cell: "a steel chamber five metres wide, filled almost to the top with steaming acid", act: "heaves itself up out of the acid, the dissolved flesh on its back knitting itself together as it climbs, and slams its forelimbs against the steel wall hard enough to dent it", shot: "tilt up, small, slow", sfx: "acid hissing and bubbling, a deep wet growl and steel booming and groaning under the blows"}
  - value: "a pack predator the size of a bear, with translucent red, wet-looking skin, a long head with no eyes or eye sockets at all, jaws lined with long, faintly glowing red fangs and a ridge of spines running down its back"
    props: {id: "SCP-939", cite: "\"SCP-939\" by Adam Smascher and EchoFourDelta, from the SCP Wiki. Source: https://scpwiki.com/scp-939. Licensed under CC BY-SA 3.0.", cell: "a dark, dripping concrete cell lit only by a dim red lamp", act: "climbs out of the darkness on all fours toward the camera, the spines along its back rising one by one as it senses the air, then opens its jaws and says \"Hello? Is someone there? I'm hurt\" in a calm human man's voice, its jaws barely moving", shot: "static", sfx: "wet claws clicking on concrete, water dripping and slow, heavy breathing"}
  - value: "a large, round blob of translucent orange slime about two metres wide, a thin shiny membrane around a thick jelly that glows where the light passes through it"
    props: {id: "SCP-999", cite: "\"SCP-999\" by ProfSnider, from the SCP Wiki. Source: https://scpwiki.com/scp-999. Licensed under CC BY-SA 3.0.", cell: "a bright, tidy pen with a padded floor, scattered toys and a bowl of sweets", act: "wobbles with excitement, slithers across the floor toward the camera, rises up tall and wraps two soft pseudopods around the lens as if hugging it", shot: "static", sfx: "happy high-pitched gurgling and cooing and a wet squelch with every movement"}
  - value: "a colossal moray eel, its head alone wider than a truck, its body as thick as a building and so long that it disappears into the dark in both directions"
    props: {id: "SCP-3000", cite: "\"SCP-3000\" by A Random Day, djkaktus, and Joreth, from the SCP Wiki. Source: https://scpwiki.com/scp-3000. Licensed under CC BY-SA 3.0.", cell: "the pitch-black deep sea, far below any sunlight, lit only by the floodlights of a small research submersible", act: "slowly turns its enormous head into the floodlights, its jaw opening and closing as its gills pulse, while a thin film of dark grey slime drifts off its skin", shot: "pull out, large, slow", sfx: "the deep hum of water pressure, a sonar ping and a slow, enormous grinding movement"}
