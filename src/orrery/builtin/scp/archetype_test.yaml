meta: {source: "orrery pack: five SCP Wiki entities that each test where MiniMax H3 pulls an unfamiliar design (a whole cat, real dragons, a cartoon, one dominant half of a hybrid, a plain stag). value: a description written against that pull, archetype-breaking features first as visible contrasts; naive: the plain description the pull wins on; pull: the prediction for naive; watch: what the counter description may still lose. act and cell are shared, so the two versions differ only in the description", license: "CC BY-SA 3.0 (https://creativecommons.org/licenses/by-sa/3.0/). Unlike the rest of orrery, this file is adapted from SCP Wiki articles and shares their license. Each entry's cite names its article, authors and source. Anything made from it is an adaptation too: credit the cite and share it under CC BY-SA 3.0.", builtin: true}
entries:
  - value: "a small grey tabby cat that ends just behind its ribcage in a flat, perfectly black cut face, as if it had been sliced clean through, with no back half, no fur, no blood and nothing inside showing, which walks with its body held perfectly level as if unseen hind legs carried it"
    props: {id: "SCP-529", cite: "\"SCP-529\" by Unknown Author, from the SCP Wiki. Source: https://scpwiki.com/scp-529. Licensed under CC BY-SA 3.0.", naive: "a grey tabby cat that is missing its back half", cell: "a long fluorescent-lit corridor on the lowest floor of an old research facility, a food bowl with cubes of cheese against the wall", act: "From the very first second the cat walks across the frame from left to right in profile, stops at the bowl, eats a cube of cheese and looks up at the camera.", shot: "truck right, small, slow", sfx: "soft padding paws, a quiet purr and a fluorescent hum", pull: "a whole cat: the back half grows back, or stays hidden behind the bowl or a wall edge", watch: "the black face turning into a shadow, fur or a cartoon cut; the cat turning to face the camera so the cut is never seen"}
  - value: "a silver spray-painted cardboard box with HERE BE DRAGONS written on its lid in black marker, holding hundreds of palm-sized dragons folded from sheets of coloured paper, every body made of crisp creases and flat facets, paper wings the lamp light shines through, pleated paper tails, and no scales or skin anywhere, only folded paper"
    props: {id: "SCP-1762", cite: "\"SCP-1762\" by OZ Ouroboros, from the SCP Wiki. Source: https://scpwiki.com/scp-1762. Licensed under CC BY-SA 3.0.", naive: "a cardboard box full of small dragons", cell: "a researcher's cluttered office at night, papers and coffee cups around a desk lamp", act: "From the very first second the lid flips open, a puff of black smoke rolls out and clears, and the little dragons pour out in a stream, flapping and circling the desk lamp like a flock of birds.", shot: "pull out, small, slow", sfx: "a cardboard lid thumping open, a soft whoosh of smoke and hundreds of small wings fluttering", pull: "real fantasy dragons with scales and skin, CG-glossy", watch: "the paper turning into origami cranes or birds; the lid text garbled"}
  - value: "a creature as long as a hand with a snail's spiral shell, striped yellow and brown, on its back, but in front of the shell a small lizard-like head: a hinged jaw with tiny teeth, two curled horns and a loose sac of skin under the chin, its body banana-yellow and wet"
    props: {id: "SCP-111", cite: "\"SCP-111\" by Adam Henderson, from the SCP Wiki. Source: https://scpwiki.com/scp-111. Licensed under CC BY-SA 3.0.", naive: "a baby dragon snail", cell: "a glass terrarium planted like a mossy forest floor, fine mist drifting over ferns and a fallen log, a keeper's hand in a blue glove resting on the moss", act: "From the very first second it glides along the log toward the gloved hand, stops, lifts its head, opens its jaw and puffs a short jet of orange flame, then hoots softly.", shot: "push in, small, slow", sfx: "wet gliding on bark, a soft whoosh of flame and a small hooting call", pull: "a cute cartoon baby dragon with wings and legs, or a plain garden snail with the fire as a separate effect", watch: "the horns turning into snail eye-stalks; the lizard head shrinking back into a snail head"}
  - value: "two teardrop-shaped creatures as tall as a shoebox, one burnt orange and one mustard yellow, with slightly scuffed rubbery skin, a single wet, living blue eye with a real iris and fine red veins in the middle of each body, and a small worn rubber wheel underneath instead of feet"
    props: {id: "SCP-131", cite: "\"SCP-131\" by Unknown Author, from the SCP Wiki. Source: https://scpwiki.com/scp-131. Licensed under CC BY-SA 3.0.", naive: "two cute little eye creatures, one orange and one yellow, each with one big eye", cell: "a busy research-facility corridor with a grey lino floor and people's legs walking past", act: "From the very first second they race down the corridor, cannot brake, bump into a table leg, spin round and circle a researcher's shoes, babbling in high squeaky voices and never blinking.", shot: "tracking, fast", sfx: "rubber wheels squeaking on lino, a soft bump and high-pitched babbling", pull: "glossy CG cartoon characters, a mascot look, maybe arms, legs or mouths added", watch: "a toy or animatronic look instead of a living one; the eye turning into a cartoon eye"}
  - value: "a colossal pale green deer-like animal nearly three metres tall at the shoulder whose face is hairless and human, with calm human eyes, a human nose and lips, under vast white antlers marbled with black, and behind its head a thick ring of floating ice with seven small metallic spheres turning slowly around it"
    props: {id: "SCP-2845", cite: "\"SCP-2845\" by Djoric, from the SCP Wiki. Source: https://scpwiki.com/scp-2845. Licensed under CC BY-SA 3.0.", naive: "a giant majestic alien stag with huge antlers", cell: "a frozen chamber at minus 110 degrees, frost-covered steel walls, rows of tall hexagonal columns with rubbery yellow-green skin, and a researcher in an orange hazmat suit standing at the edge", act: "From the very first second it lowers its head toward the researcher, who barely reaches its chest, and wherever its hooves touch the floor, silver metal grows up like frost-covered plants.", shot: "arc, small, slow", sfx: "a deep resonant hum, ice cracking and metal creaking as it grows", pull: "an ordinary majestic stag or elk, fantasy-glowing antlers; no human face, no ring", watch: "the face becoming a deer face with human eyes or a mask; the ring becoming a halo or glow"}
