[project]
name = "orrery"
version = "0.1.0"
description = "Prompt DSL that records every pick, an LLM wildcard manager, and a MiniMax H3 compiler"
authors = [
    { name = "pyros-projects", email = "pyros.sd.models@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
orrery = "orrery.cli:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
