name: Feature
description: A new feature or an extension
labels: ["type:feature", "status:ready-for-refinement"]

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should be built? A short, clear description of the result. One slice is at most 8 hours of work for a person; split anything bigger.
      placeholder: Describe the feature and what it is good for.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: When is the issue done?
      placeholder: |
        - [ ] ...
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: technical_notes
    attributes:
      label: Technical notes
      description: Relevant technical details, APIs, data models, dependencies.
      placeholder: |
        - Affected components:
        - Relevant endpoints:
        - Dependencies:
        - Additional context:
    validations:
      required: false
