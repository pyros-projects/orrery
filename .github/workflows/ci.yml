# The three checks of AGENTS.md, in full, on every PR and on main, on each Python orrery supports.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: checks (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv tags full versions only, there is no v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: uv sync --frozen
      - name: ruff
        run: uv run ruff check src tests
      - name: pytest
        run: uv run pytest -n auto
      - name: node --test
        run: node --test tests/js/*.mjs

  checks:  # the check main requires: green when the checks pass on every Python (always runs: skipped would count as passed)
    needs: python
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.python.result }}" = success
